name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nasa-web-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/org666777148852/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Nuxt application
        run: pnpm build

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST" || { echo 'DEPLOY_HOST is unavailable'; exit 1; }
          test -n "$DEPLOY_USER" || { echo 'DEPLOY_USER is unavailable'; exit 1; }
          test -n "$DEPLOY_KEY" || { echo 'DEPLOY_KEY is unavailable'; exit 1; }
          mkdir -p "$RUNNER_TEMP/ssh" "$HOME/.ssh"
          chmod 700 "$RUNNER_TEMP/ssh" "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          else
            ssh-keyscan -T 10 -t ed25519 -H "$DEPLOY_HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          fi
          test -s "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nasa-swarm
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile $RUNNER_TEMP/ssh/key
            UserKnownHostsFile $RUNNER_TEMP/ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Deploy image to Docker Swarm
        env:
          DOCKER_HOST: ssh://nasa-swarm
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: docker stack deploy --with-registry-auth --detach=false -c docker-stack.yml nasa-web
      - name: Remove SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh" "$HOME/.ssh/config"
